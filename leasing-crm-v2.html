<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMMIT Business Center — Управление арендой</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --steel-900:#0e1b2a;
    --steel-800:#15293d;
    --steel-700:#1f3b56;
    --steel-500:#3a5e82;
    --steel-300:#7e9bb6;
    --paper:#f3f5f7;
    --paper-2:#e7ecf0;
    --card:#ffffff;
    --ink:#0e1b2a;
    --ink-soft:#54677a;
    --line:#dde4ea;
    --amber:#e0922f;
    --amber-soft:#fbe9d0;
    --hot:#d8472f;
    --hot-soft:#fbe0db;
    --warm:#e0922f;
    --warm-soft:#fbe9d0;
    --cold:#4d83c4;
    --cold-soft:#dbe8f6;
    --won:#2f9e6f;
    --won-soft:#d6efe4;
    --lost:#94a3af;
    --lost-soft:#e7ecf0;
    --radius:14px;
    --shadow:0 1px 2px rgba(14,27,42,.06),0 8px 24px rgba(14,27,42,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.mono{font-family:'Space Grotesk',sans-serif}
  button{font-family:inherit;cursor:pointer}
  .num{font-family:'Space Grotesk',sans-serif;font-feature-settings:"tnum"}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh}
  .side{
    width:230px;flex:0 0 230px;
    background:var(--steel-900);
    color:#cdd9e4;
    padding:22px 16px;
    position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;gap:6px;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;perspective:600px}
  .brand svg{flex:0 0 auto}
  @keyframes spinY{to{transform:rotateY(360deg)}}
  .brand b{font-family:'Space Grotesk';font-size:18px;color:#fff;letter-spacing:2.5px;font-weight:700;position:relative;display:inline-block;transform-style:preserve-3d;animation:spinY 6s linear infinite}
  .brand b span{display:inline-block;backface-visibility:hidden}
  .brand b .f2{position:absolute;left:0;top:0;transform:rotateY(180deg)}
  .brand small{display:block;color:var(--steel-300);font-size:11px;letter-spacing:.3px;margin-top:1px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{
    display:flex;align-items:center;gap:11px;
    background:none;border:none;color:#9fb3c6;
    padding:10px 12px;border-radius:10px;text-align:left;
    font-size:13.5px;font-weight:500;width:100%;transition:.15s;
  }
  .nav button svg{flex:0 0 auto;opacity:.85}
  .nav button:hover{background:var(--steel-800);color:#eaf1f7}
  .nav button.active{background:var(--steel-700);color:#fff}
  .side-foot{margin-top:auto;font-size:11px;color:var(--steel-500);padding:8px;line-height:1.5}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:18px 30px;border-bottom:1px solid var(--line);
    background:rgba(243,245,247,.85);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:20;
  }
  .topbar h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.2px}
  .topbar .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .btn{
    border:1px solid var(--line);background:var(--card);
    padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600;
    color:var(--ink);display:inline-flex;align-items:center;gap:7px;transition:.15s;
  }
  .btn:hover{border-color:var(--steel-300)}
  .btn.primary{background:var(--steel-900);color:#fff;border-color:var(--steel-900)}
  .btn.primary:hover{background:var(--steel-800)}
  .content{padding:26px 30px 60px}
  .view{display:none}
  .view.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- KPI ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lab{color:var(--ink-soft);font-size:12px;font-weight:600;letter-spacing:.2px;text-transform:uppercase}
  .kpi .val{font-size:30px;font-weight:700;margin:8px 0 2px;letter-spacing:-1px}
  .kpi .val small{font-size:15px;color:var(--ink-soft);font-weight:600;letter-spacing:0}
  .kpi .delta{font-size:12px;font-weight:600}
  .kpi .delta.up{color:var(--won)}
  .kpi .delta.down{color:var(--hot)}
  .kpi-accent{position:absolute;left:0;top:0;bottom:0;width:4px}

  .grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:20px;margin-bottom:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
  .panel-h h3{margin:0;font-size:15px;font-weight:600}
  .panel-h .hint{font-size:11.5px;color:var(--ink-soft)}
  .panel-b{padding:4px 18px 18px}

  /* funnel bars */
  .funnel{display:flex;flex-direction:column;gap:9px;padding:6px 0}
  .frow{display:flex;align-items:center;gap:12px}
  .frow .name{width:120px;flex:0 0 120px;font-size:12.5px;color:var(--ink-soft);font-weight:500}
  .frow .track{flex:1;height:30px;background:var(--paper-2);border-radius:7px;overflow:hidden;position:relative}
  .frow .fill{height:100%;border-radius:7px;display:flex;align-items:center;padding-left:11px;color:#fff;font-size:12.5px;font-weight:600;transition:width .7s cubic-bezier(.2,.7,.2,1)}
  .frow .cnt{width:64px;flex:0 0 64px;text-align:right;font-size:13px;font-weight:600}

  /* stack of floors (signature) */
  .bmap{display:flex;gap:24px;align-items:stretch}
  .building{flex:0 0 162px;display:flex;align-items:center;justify-content:center;padding:2px 0}
  .building svg{width:100%;height:auto;display:block}
  .stack{flex:1;display:flex;flex-direction:column-reverse;gap:4px;padding:6px 4px;min-width:0}
  .floor{display:flex;align-items:center;gap:10px;height:26px}
  .floor .fl-n{width:30px;flex:0 0 30px;text-align:right;font-size:11px;color:var(--ink-soft);font-weight:600}
  .floor .fl-occ{width:40px;flex:0 0 40px;text-align:right;font-size:11px;font-weight:700;color:var(--ink)}
  .floor .fl-occ.free{color:var(--steel-300);font-weight:600}
  .floor .fl-pills{flex:0 0 250px;display:flex;gap:6px;align-items:center;overflow:hidden}
  .floor .pl{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .floor .pl-occ{background:var(--won-soft);color:var(--won)}
  .floor .pl-free{background:var(--paper-2);color:var(--ink-soft)}
  .fl-bar-wrap{flex:1;position:relative;display:flex;align-items:center}
  .floor .fl-bar{flex:1;height:22px;border-radius:5px;background:var(--paper-2);overflow:hidden;cursor:pointer;display:flex;gap:1px}
  .comp-badge{position:absolute;top:-9px;left:0;transform:translateX(-50%);min-width:23px;height:23px;border-radius:999px;background:#ef4136;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff;box-shadow:0 0 0 0 rgba(239,65,54,.9);animation:compPulse 1.35s ease-out infinite;z-index:10;cursor:pointer;pointer-events:auto}
  .comp-badge:hover{background:#d92d22}
  @keyframes compPulse{0%{box-shadow:0 0 0 0 rgba(239,65,54,.85)}70%{box-shadow:0 0 0 12px rgba(239,65,54,0)}100%{box-shadow:0 0 0 0 rgba(239,65,54,0)}}
  .floor .fl-bar .seg{height:100%;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:pointer;transition:filter .12s}
  .floor .fl-bar .seg:hover{filter:brightness(1.1)}
  .floor .fl-bar:hover{outline:2px solid var(--steel-300);outline-offset:1px}
  .floor .fl-tog{flex:0 0 30px;display:flex;align-items:center}
  .floor.inactive{opacity:.55}
  .floor .pl-off{background:var(--paper-2);color:var(--steel-300);font-style:italic}
  .floor .fl-bar-off{background:repeating-linear-gradient(45deg,var(--paper-2),var(--paper-2) 6px,#eef2f5 6px,#eef2f5 12px);cursor:default}
  .tog{position:relative;width:30px;height:17px;border-radius:20px;border:none;padding:0;cursor:pointer;background:var(--won);transition:background .18s;flex:0 0 auto}
  .tog.off{background:var(--steel-300)}
  .tog::after{content:'';position:absolute;top:2px;left:15px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 2px rgba(14,27,42,.25)}
  .tog.off::after{left:2px}

  /* config page */
  .zhead{display:inline-flex;align-items:center;gap:6px}
  .zdot{width:11px;height:11px;border-radius:3px;display:inline-block}
  .zdot.z1{background:#7e9bb6}.zdot.z2{background:#4d83c4}.zdot.z3{background:#e0922f}.zdot.z4{background:#2f9e6f}
  .cellin{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card)}
  input.cellin{width:84px;text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:600}
  .rate-in{display:flex;align-items:center;gap:4px;color:var(--ink-soft)}
  .rate-in input{width:68px}
  tr.rowoff{opacity:.5}
  /* config: floors → units accordion */
  .cfg-floors{display:flex;flex-direction:column;gap:8px;padding:6px 0}
  .cfg-fl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .cfg-fl.cfg-off{opacity:.62}
  .cfg-fl.open{box-shadow:var(--shadow);border-color:var(--steel-300)}
  .cfg-fl-h{display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer}
  .cfg-fl-h:hover{background:#f7fafc}
  .cfg-fl-n{flex:0 0 34px;font-size:18px;font-weight:700;letter-spacing:-.5px}
  .cfg-fl-type{flex:0 0 200px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cfg-fl-meta{flex:1;font-size:12.5px;color:var(--ink-soft)}
  .cfg-caret{flex:0 0 auto;color:var(--ink-soft);font-size:12px}
  .cfg-units{padding:6px 16px 16px;border-top:1px solid var(--line);background:#fbfcfd}
  .cfg-utbl{width:100%;border-collapse:collapse;box-shadow:none;background:transparent}
  .cfg-utbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);font-weight:700;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
  .cfg-utbl td{padding:5px 8px;border-bottom:1px solid var(--line)}
  .cfg-utbl tr:last-child td{border-bottom:none}
  .cfg-utbl .cellin{width:100%;max-width:none}
  @media(max-width:760px){.cfg-fl-type{flex-basis:120px}}
  /* status map (Этажи → помещения) */
  .smap{display:flex;flex-direction:column;gap:5px;padding:6px 2px}
  .smap-row{display:flex;align-items:center;gap:12px}
  .smap-n{flex:0 0 36px;text-align:right;font-size:13px;font-weight:700;color:var(--ink)}
  .smap-bar{flex:1;display:flex;gap:6px;align-items:center}
  .smap-bar .u{height:30px;line-height:30px;border-radius:999px;padding:0 12px;font-size:9.5px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-width:30px;box-shadow:0 1px 2px rgba(14,27,42,.12);transition:filter .12s,transform .12s}
  .smap-bar .u:hover{filter:brightness(1.06);transform:translateY(-1px)}
  /* unit multi-select chips in deal card */
  .unitchips{display:flex;flex-wrap:wrap;gap:6px}
  .uchip{border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:9px;font-size:12px;font-weight:600;color:var(--steel-700);cursor:pointer}
  .uchip:hover{border-color:var(--steel-300)}
  .uchip.on{background:var(--steel-900);color:#fff;border-color:var(--steel-900)}
  .autohint{font-weight:500;text-transform:none;letter-spacing:0;color:var(--steel-500);font-size:10px}

  /* 3 cards row (Итоги · Воронка · Статус) — равная высота, контент на всю площадь */
  .grid3{display:grid;grid-template-columns:1.05fr 1.35fr 0.95fr;gap:20px;margin-bottom:20px;align-items:stretch}
  .grid3 .panel{display:flex;flex-direction:column}
  .grid3 .panel-b{flex:1;display:flex;flex-direction:column;justify-content:center}
  .grid3 .panel-b > svg{align-self:center}
  .seg-chips{display:flex;gap:6px}
  .seg-chips .chip{padding:5px 11px;font-size:12px}
  .pstat-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .pstat-row:last-child{border-bottom:none}
  .grid3 .pstat-row{flex:1}
  .pstat-row .pv{flex:0 0 100px;text-align:right;font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
  .pstat-row .pl{font-size:12.5px;color:var(--ink-soft)}
  .grid3 .panel-b > .funnel{flex:1;justify-content:space-between}
  @media(max-width:1080px){.grid3{grid-template-columns:1fr}.grid3 .panel-b{justify-content:flex-start}.grid3 .pstat-row{flex:0 0 auto}}
  @media(max-width:760px){.seg-chips{flex-wrap:wrap}}

  /* tasks panel */
  .tasklist{display:flex;flex-direction:column;padding:2px 0}
  .task{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
  .task:last-child{border-bottom:none}
  .task:hover{background:#f7fafc}
  .task-tag{flex:0 0 92px;text-align:center;font-size:10px;font-weight:700;padding:4px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
  .task-tag.late{background:var(--hot-soft);color:var(--hot)}
  .task-tag.now{background:var(--amber-soft);color:#b06f12}
  .task-tag.soon{background:var(--paper-2);color:var(--ink-soft)}
  .task-main{flex:1;min-width:0}
  .task-t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-sub{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* management report (print) */
  #report{display:none}
  @media print{
    .shell,.scrim,.drawer{display:none!important}
    body{background:#fff}
    #report{display:block!important;color:#000;font-family:'Inter',sans-serif;padding:0}
    #report h1{font-size:22px;margin:0 0 2px}
    #report .rep-date{color:#555;margin-bottom:16px;font-size:13px}
    #report h2{font-size:15px;margin:20px 0 8px;border-bottom:2px solid #000;padding-bottom:4px}
    #report .rep-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
    #report .rep-kpi div{border:1px solid #ccc;border-radius:8px;padding:10px}
    #report .rep-kpi b{display:block;font-size:21px;font-family:'Space Grotesk',sans-serif}
    #report .rep-kpi span{font-size:11px;color:#555}
    #report .rep-t{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
    #report .rep-t th,#report .rep-t td{border:1px solid #ccc;padding:6px 8px;text-align:left}
    #report .rep-t th{background:#f0f0f0}
    #report .rep-foot{margin-top:22px;font-size:10px;color:#888}
    @page{margin:14mm}
  }
  @media(max-width:760px){.bmap{flex-direction:column}.building{flex:0 0 auto;max-width:180px;margin:0 auto}}

  /* weekly meetings bar chart */
  .weekbars{display:flex;align-items:stretch;gap:8px;height:170px;padding:8px 2px 0}
  .wb{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
  .wb-v{height:16px;font-size:11px;font-weight:700;color:var(--steel-700)}
  .wb-track{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .wb-fill{width:62%;max-width:34px;background:var(--steel-500);border-radius:5px 5px 0 0;min-height:2px;transition:height .6s cubic-bezier(.2,.7,.2,1)}
  .wb:hover .wb-fill{background:var(--steel-700)}
  .wb-x{height:16px;margin-top:6px;font-size:9.5px;color:var(--ink-soft);white-space:nowrap}

  /* activity log buttons in drawer */
  .logbtns{display:flex;gap:7px;margin:8px 0 12px;flex-wrap:wrap}
  .logb{border:1px solid var(--line);background:var(--card);padding:7px 11px;border-radius:9px;font-size:12px;font-weight:600;color:var(--steel-700)}
  .logb:hover{border-color:var(--steel-300);background:var(--paper-2)}
  .logb.on{background:var(--steel-900);color:#fff;border-color:var(--steel-900)}
  .addact{display:flex;gap:8px;margin:0 0 12px}
  .addact input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:var(--card)}
  .addact .btn{flex:0 0 auto;padding:9px 14px}
  .acn{font-size:12px;color:var(--ink);background:var(--paper-2);border-radius:7px;padding:5px 9px;margin:3px 0 2px;line-height:1.45}

  /* tasks editor in drawer */
  .tasklist-edit{display:flex;flex-direction:column;gap:6px;margin-bottom:9px}
  .te{display:flex;flex-direction:column;gap:7px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .te-top{display:flex;align-items:center;gap:9px}
  .te-comment{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-family:inherit;background:var(--paper)}
  .te-comment:focus{outline:none;border-color:var(--steel-300);background:var(--card)}
  .te.late{border-color:var(--hot);background:var(--hot-soft)}
  .te.done{opacity:.6}
  .te.done .te-text{text-decoration:line-through}
  .te-check{flex:0 0 18px;width:18px;height:18px;border:2px solid var(--steel-300);border-radius:5px;background:var(--card);cursor:pointer;padding:0;position:relative}
  .te-check.on{background:var(--won);border-color:var(--won)}
  .te-check.on::after{content:'✓';color:#fff;font-size:12px;font-weight:700;position:absolute;top:-3px;left:2px}
  .te-main{flex:1;min-width:0}
  .te-text{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .te-date{font-size:11px;color:var(--ink-soft);margin-top:1px}
  .te.late .te-date{color:var(--hot);font-weight:600}
  .te-del{flex:0 0 auto;border:none;background:none;color:var(--ink-soft);font-size:14px;cursor:pointer;padding:2px 4px;border-radius:6px}
  .te-del:hover{background:var(--paper-2);color:var(--hot)}
  .addtask{display:flex;gap:8px;flex-wrap:wrap}
  .addtask #f_newtask{flex:1;min-width:120px}
  .addtask input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:var(--card)}
  .addtask .btn{flex:0 0 auto}
  .muted{font-size:12.5px;color:var(--ink-soft);padding:4px 2px;line-height:1.5}
  /* prioritization block */
  .prio-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .prio-lab{font-size:13px;color:var(--ink-soft);font-weight:600}
  .prio-sel{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:var(--card)}
  .scoregrid{display:flex;flex-direction:column;gap:6px}
  .score-row{display:flex;align-items:center;gap:10px}
  .score-lab{flex:1;font-size:12.5px;color:var(--ink)}
  .score-in{flex:0 0 66px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:'Space Grotesk',sans-serif;font-weight:600;background:var(--card);text-align:center}
  .legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px 4px;font-size:11.5px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* ---------- Pipeline / kanban ---------- */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
  .col{flex:0 0 270px;background:var(--paper-2);border-radius:var(--radius);display:flex;flex-direction:column;max-height:74vh}
  .col-h{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}
  .col-h .ttl{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}

function seed(){
  const today=Date.now();
  const deals=PROSPECTS.map((p,i)=>{
    const [tenant,industry,basis,fin,image,demand,longterm,classA,prio]=p;
    const created=today-i*60000;
    return {id:'d'+(i+1),tenant,industry,email:'',phone:'',stage:'lead',temp:'cold',
      floor:0,units:[],area:0,rate:0,agreedRate:'',term:0,basis:basis||'',note:'',priority:prio,
      scores:{fin,image,demand,longterm,classA},created,updated:created,tasks:[],

  });
  return {deals,floors:seedFloors()};
}

function isoDays(ago){const d=new Date(Date.now()-ago*86400000);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'});}
function fmtDate(ts){return new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'});}
function ymd(d){const x=d||new Date();const m=String(x.getMonth()+1).padStart(2,'0');const day=String(x.getDate()).padStart(2,'0');return x.getFullYear()+'-'+m+'-'+day;}
function fmtDay(s){if(!s)return '';const x=new Date(s+'T00:00:00');return x.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'});}
function ddmmyy(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2);}
function weekBuckets(n){
  const now=new Date();
  const dow=(now.getDay()+6)%7;                 // 0 = понедельник
  const thisMon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow).getTime();
  const W=7*86400000, out=[];
  for(let i=n-1;i>=0;i--){const start=thisMon-i*W; out.push({start,end:start+W,label:fmtDate(start)});}
  return out;
}

/* ---------- metrics ---------- */
function metrics(){
  const d=DB.deals;
  const won=d.filter(x=>x.stage==='won'&&floorActive(x.floor));
  const active=d.filter(x=>x.stage!=='won');
  const occM2=won.reduce((s,x)=>s+x.area,0);
  const totalM2=(DB.floors||[]).filter(f=>f.active).reduce((s,f)=>s+(f.gla||floorAreaSum(f)),0)||1;
  const pipelineVal=active.reduce((s,x)=>s+x.area*dealRate(x),0);
  const wonVal=won.reduce((s,x)=>s+x.area*dealRate(x),0);
  const weighted=active.reduce((s,x)=>{
    const w={lead:.1,qual:.25,tour:.45,loi:.65,nego:.85}[x.stage]||0;
    return s+x.area*dealRate(x)*w;
  },0);
  return {won,active,occM2,totalM2,occPct:Math.round(occM2/totalM2*100),
    pipelineVal,wonVal,weighted,
    hot:active.filter(x=>x.temp==='hot').length};
}

/* ---------- period (за месяц / квартал) ---------- */
let PERIOD='month';
function periodRange(p){
  const now=new Date();
  if(p==='all') return {start:0,end:now.getTime()+86400000,label:'за всё время'};
  if(p==='quarter'){
    const q=Math.floor(now.getMonth()/3);
    const start=new Date(now.getFullYear(),q*3,1).getTime();
    return {start,end:now.getTime()+86400000,label:'за '+['I','II','III','IV'][q]+' квартал '+now.getFullYear()};
  }
  const start=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  return {start,end:now.getTime()+86400000,label:'за '+now.toLocaleDateString('ru-RU',{month:'long'})+' '+now.getFullYear()};
}
function periodStats(r){
  const acts=DB.deals.flatMap(d=>d.acts||[]);
  const meetings=acts.filter(a=>a&&a.type==='meeting'&&a.ts>=r.start&&a.ts<r.end).length;
  const signed=DB.deals.filter(d=>d.stage==='won'&&(d.signedAt||d.updated||0)>=r.start&&(d.signedAt||d.updated||0)<r.end);
  return {meetings,signedCount:signed.length,
    signedArea:signed.reduce((s,d)=>s+d.area,0),
    signedVal:signed.reduce((s,d)=>s+d.area*dealRate(d),0),
    newDeals:DB.deals.filter(d=>(d.created||0)>=r.start&&(d.created||0)<r.end).length};
}

/* ---------- классическая воронка ---------- */
function funnelSVG(stages){
  const n=stages.length, W=520, bandH=33, padTop=4, padBot=4, cx=W/2;
  const H=padTop+padBot+n*bandH;
  const maxHalf=104, endHalf=20;            // строго прямые грани: верх широкий, низ узкий
  const top=padTop, bot=H-padBot, span=bot-top;
  const halfAt=y=> maxHalf-(maxHalf-endHalf)*((y-top)/span);  // ширина на любой высоте лежит на одной прямой
  let out='';
  for(let i=0;i<n;i++){
    const yTop=top+i*bandH, yBot=yTop+bandH;
    const hT=halfAt(yTop), hB=halfAt(yBot);
    const yc=(yTop+yBot)/2+4;
    out+=`<path d="M${(cx-hT).toFixed(2)} ${yTop.toFixed(2)} L${(cx+hT).toFixed(2)} ${yTop.toFixed(2)} L${(cx+hB).toFixed(2)} ${yBot.toFixed(2)} L${(cx-hB).toFixed(2)} ${yBot.toFixed(2)} Z" fill="${stages[i].color}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>`;
    out+=`<text x="${cx}" y="${yc}" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#fff">${stages[i].n||''}</text>`;
    out+=`<text x="${(cx-maxHalf-13).toFixed(0)}" y="${yc}" text-anchor="end" font-family="Inter,sans-serif" font-size="12.5" font-weight="500" fill="#54677a">${stages[i].name}</text>`;
    out+=`<text x="${(cx+maxHalf+13).toFixed(0)}" y="${yc}" text-anchor="start" font-family="Space Grotesk,sans-serif" font-size="13" font-weight="600" fill="#0e1b2a">$${money(stages[i].val)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:495px;height:auto;display:block">${out}</svg>`;
}

async function markTaskDone(did,tid){
  const d=DB.deals.find(x=>x.id===did); if(!d)return;
  const t=(d.tasks||[]).find(x=>x.id===tid); if(!t||t.done)return;
  t.done=true; t.doneAt=Date.now();
  (d.acts=d.acts||[]).unshift({type:'done',t:'Выполнено: '+t.text,ts:Date.now(),note:t.comment||''});
  d.updated=Date.now(); await save();
  const cur=document.querySelector('.nav button.active')?.dataset.v; if(cur)render(cur);
}

function weeklyChartsHTML(weeks,meetCounts,maxMeet,totalMeet,cumArea){
  // общая геометрия для обоих графиков — чтобы оси X были на одном уровне
  const W=520,H=180,padX=20,padTop=26,padBot=24, n=weeks.length;
  const px=i=> padX+(W-2*padX)*(n>1?i/(n-1):0);
  const baseY=H-padBot;
  const axis=`<line x1="${padX}" y1="${baseY}" x2="${W-padX}" y2="${baseY}" stroke="#e3e8ee" stroke-width="1"/>`;
  const xlab=weeks.map((w,i)=>{const a=i===0?'start':(i===n-1?'end':'middle');return `<text x="${px(i).toFixed(1)}" y="${H-7}" text-anchor="${a}" font-size="9.5" fill="#8a99a8" font-family="Inter,sans-serif">${ddmmyy(w.start)}</text>`;}).join('');

  // --- area chart: cumulative leased m² ---
  const maxA=Math.max(...cumArea,1);
  const ay=v=> baseY-(baseY-padTop)*(v/maxA);
  const apts=cumArea.map((v,i)=>[px(i),ay(v)]);
  const aline=apts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const afill=`M${px(0)} ${baseY} `+apts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${px(n-1)} ${baseY} Z`;
  const last=cumArea[n-1]; const valY=Math.max(14,apts[n-1][1]-9);
  const areaSvg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f9e6f" stop-opacity=".30"/><stop offset="1" stop-color="#2f9e6f" stop-opacity="0"/></linearGradient></defs>
    ${axis}
    <path d="${afill}" fill="url(#ag)"/>
    <path d="${aline}" fill="none" stroke="#2f9e6f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${apts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#2f9e6f"/>`).join('')}
    ${xlab}
    <text x="${px(n-1).toFixed(1)}" y="${valY.toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="#0e1b2a" font-family="Space Grotesk,sans-serif">${money(last)} м²</text>
  </svg>`;

  // --- meetings: vertical bars ---
  const my=v=> baseY-(baseY-padTop)*(v/maxMeet);
  const bw=Math.min(26,(W-2*padX)/n*0.55);
  const bars=weeks.map((w,i)=>{
    const c=meetCounts[i]; if(!c) return '';
    const y=my(c), x=px(i)-bw/2, h=baseY-y;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="#3a5e82"/>
      <text x="${px(i).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#0e1b2a" font-family="Space Grotesk,sans-serif">${c}</text>`;
  }).join('');
  const meetSvg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${axis}${bars}${xlab}</svg>`;

  return `<div class="grid2">
    <div class="panel">
      <div class="panel-h"><h3>Сданная площадь, м²</h3><span class="hint">накопительно · подписанные договоры</span></div>
      <div class="panel-b">${areaSvg}</div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>Встречи по неделям</h3><span class="hint">всего за 8 недель: ${totalMeet}</span></div>
      <div class="panel-b">${meetSvg}</div>
    </div>
  </div>`;
}

          ${list.map(dealCard).join('')||'<div style="font-size:11.5px;color:var(--ink-soft);text-align:center;padding:14px 0">пусто</div>'}
        </div></div>`;
    }).join('')}
  </div>`;
  bindDnD();
}
function dealCard(d){
  return `<div class="deal" draggable="true" data-id="${d.id}" onclick="openDeal('${d.id}')">
    <div class="dn">${d.tenant}</div>
    <div class="dm"><span>Этаж ${d.floor}</span><span>${money(d.area)} м²</span></div>
    <div class="drow">
      <span class="price num">$${money(d.area*dealRate(d))}/мес</span>
      <span class="temp ${d.temp}">${TEMPS[d.temp]}</span>
    </div></div>`;
}
function bindDnD(){
  let dragId=null;
  document.querySelectorAll('.deal').forEach(c=>{
    c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('drag');e.stopPropagation();});
    c.addEventListener('dragend',()=>{dragId=null;c.classList.remove('drag');document.querySelectorAll('.col').forEach(x=>x.classList.remove('drop'));});
  });
  document.querySelectorAll('.col-body').forEach(b=>{
    const col=b.closest('.col');
    b.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop');});
    b.addEventListener('dragleave',()=>col.classList.remove('drop'));
    b.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('drop');
      if(!dragId)return;
      const d=DB.deals.find(x=>x.id===dragId);
      const ns=b.dataset.stage;
      if(d&&d.stage!==ns){
        d.acts.unshift({type:'stage',t:`Этап: ${STAGES.find(s=>s.id===d.stage).name} → ${STAGES.find(s=>s.id===ns).name}`,ts:Date.now()});
        d.stage=ns;d.updated=Date.now();
        if(ns==='won'){d.temp='hot';d.signedAt=Date.now();d.acts.unshift({type:'won',t:'Договор подписан · '+money(d.area)+' м²',ts:Date.now()});}
        await save();renderPipe();
      }
    });
  });
}

/* ---------- FLOORS ---------- */
function dealsOnUnit(fl,num){return DB.deals.filter(d=>d.floor===fl && (d.units||[]).includes(num));}
function unitStatus(fl,num){
  const ds=dealsOnUnit(fl,num);
  if(ds.some(d=>d.stage==='won')) return 'booked';
  if(ds.length) return 'proc';
  return 'free';
}
function dealOnUnit(fl,num){
  const ds=dealsOnUnit(fl,num);
  return ds.find(d=>d.stage==='won')||ds[0]||null;
}
function renderFloors(){
  const el=document.getElementById('view-floors');
  const SL={booked:'Бронь',proc:'В процессе',free:'Свободно'};
  const SC={booked:'#e3796b',proc:'#f1c453',free:'#5cba8c'};   // мягкие, дружелюбные цвета
  const FG={booked:'#fff',proc:'#5e4708',free:'#fff'};
  const floors=[...DB.floors].filter(f=>f.active && (f.units||[]).length).sort((a,b)=>b.n-a.n);
  let cBooked=0,cProc=0,cFree=0;
  const rows=floors.map(f=>{
    const denom=Math.max(f.gla||0, floorAreaSum(f))||1;
    // счётчики по помещениям
    f.units.forEach(u=>{const s=unitStatus(f.n,u.number); if(s==='booked')cBooked++; else if(s==='proc')cProc++; else cFree++;});
    // группировка: помещения одной сделки сливаются в один блок; свободные — отдельно
    const groups=[]; const byKey={};
    f.units.forEach(u=>{
      const d=dealOnUnit(f.n,u.number);
      const key=d?('d:'+d.id):('f:'+u.number);
      if(!byKey[key]){byKey[key]={deal:d,num:u.number,area:0}; groups.push(byKey[key]);}
      byKey[key].area+=(u.area||0);
    });
    const segs=groups.map(g=>{
      const s=g.deal?(g.deal.stage==='won'?'booked':'proc'):'free';
      const w=Math.max(g.area/denom*100,3);
      const ar=Math.round(g.area);
      const lab=g.deal?`${esc(g.deal.tenant)}, ${ar} м²`:`${esc(g.num)}, ${ar} м²`;
      const tip=(g.deal?esc(g.deal.tenant):('Помещение '+esc(g.num)))+' · '+ar+' м²'+(g.deal?(' · ставка $'+dealRate(g.deal)+'/кв.м·мес'):'')+' · '+SL[s];
      return `<span class="u" style="width:${w}%;background:${SC[s]};color:${FG[s]}" title="${tip}" ${g.deal?`onclick="openDeal('${g.deal.id}')"`:''}>${lab}</span>`;
    }).join('');
    return `<div class="smap-row"><div class="smap-n num">${f.n}</div><div class="smap-bar">${segs}</div></div>`;
  }).join('');
  el.innerHTML=`
    <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="kpi-accent" style="background:${SC.booked}"></div><div class="lab">Бронь</div><div class="val num">${cBooked}</div></div>
      <div class="kpi"><div class="kpi-accent" style="background:${SC.proc}"></div><div class="lab">В процессе</div><div class="val num">${cProc}</div></div>
      <div class="kpi"><div class="kpi-accent" style="background:${SC.free}"></div><div class="lab">Свободно</div><div class="val num">${cFree}</div></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>Карта статусов помещений</h3><span class="hint">ширина помещения = площадь · клик — открыть сделку</span></div>
      <div class="legend">
        <span><i class="dot" style="background:${SC.booked}"></i>Бронь</span>
        <span><i class="dot" style="background:${SC.proc}"></i>В процессе</span>
        <span><i class="dot" style="background:${SC.free}"></i>Свободно</span>
      </div>
      <div class="panel-b"><div class="smap">${rows}</div></div>
    </div>`;
}

function unitChips(fn,sel){
  const us=floorUnits(fn);
  if(!us.length) return '<div class="muted">Сначала выберите этаж</div>';
  return us.map(u=>{
    const on=(sel||[]).includes(u.number);
    return `<button type="button" class="uchip ${on?'on':''}" onclick="toggleUnitChip('${esc(u.number)}')">${esc(u.number)} · ${u.area==null?'?':Math.round(u.area)} м²${u.rate?(' · $'+u.rate):''}</button>`;
  }).join('');
}
function recalcUnitTotals(){
  const fn=+document.getElementById('f_floor').value;
  let area=0,val=0;
  dealUnits.forEach(n=>{const u=unitOf(fn,n); if(u){area+=(u.area||0); val+=(u.area||0)*(u.rate||0);}});
  document.getElementById('f_area').value=area?+area.toFixed(2):0;
  document.getElementById('f_rate').value=area?+(val/area).toFixed(2):0;
}
function toggleUnitChip(num){
  const i=dealUnits.indexOf(num);
  if(i>=0)dealUnits.splice(i,1); else dealUnits.push(num);
  const fn=+document.getElementById('f_floor').value;
  document.getElementById('f_units').innerHTML=unitChips(fn,dealUnits);
  recalcUnitTotals();
}
function onFloorPick(){
  const fn=+document.getElementById('f_floor').value;
  dealUnits=[];
  document.getElementById('f_units').innerHTML=unitChips(fn,dealUnits);
  document.getElementById('f_area').value=0; document.getElementById('f_rate').value=0;
}
function esc(s){return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('open');editId=null;tempPick=null;}
function stageColor(st){return st==='won'?'var(--won)':((st==='nego'||st==='loi')?'var(--amber)':'var(--cold)');}
function stageWord(st){return st==='won'?'Занято':((st==='nego'||st==='loi')?'Переговоры':'В работе');}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}
// окно спорных помещений: помещения, на которые претендуют 2+ арендаторов (не подписано)
function openContest(f){
  const fc=floorCfg(f);
  const fdeals=DB.deals.filter(d=>d.floor===f);
  const rows=[];
  (fc.units||[]).forEach(u=>{
    const cl=fdeals.filter(d=>(d.units||[]).includes(u.number));
    if(cl.filter(d=>d.stage!=='won').length>=2) rows.push({u,cl});
  });
  const tenants=[...new Set(rows.flatMap(r=>r.cl.map(d=>d.tenant)))];
  const box=document.getElementById('modalBox');
  box.innerHTML=`
    <div class="modal-hd">
      <div>
        <h3>Спорные помещения · этаж ${f}</h3>
        <div class="sub">${rows.length} ${plural(rows.length,'помещение','помещения','помещений')} · ${tenants.length} ${plural(tenants.length,'претендент','претендента','претендентов')}. Бронь возможна на все помещения, кроме подписанных.</div>
      </div>
      <button class="modal-x" onclick="closeModal()" title="Закрыть">✕</button>
    </div>
    <div class="modal-bd">
      ${rows.map(r=>`
        <div class="contest-u">
          <div class="uhd">
            <span class="unum">Помещение ${esc(r.u.number)}</span>
            <span class="uarea">${r.u.area==null?'?':money(r.u.area)} м²</span>
            <span class="cnt">${r.cl.filter(d=>d.stage!=='won').length} ${plural(r.cl.filter(d=>d.stage!=='won').length,'претендент','претендента','претендентов')}</span>
          </div>
          ${r.cl.slice().sort((a,b)=>(a.created||0)-(b.created||0)).map((d,i)=>`
            <div class="claimant ${d.stage==='won'?'won':''}" onclick="closeModal();openDeal('${d.id}')" title="Открыть карточку">
              <span class="dot" style="background:${stageColor(d.stage)}"></span>
              <span class="nm">${esc(d.tenant)}${i===0&&d.stage!=='won'?' · первый':''}</span>
              <span class="st">${stageWord(d.stage)} · $${dealRate(d)}/м²</span>
            </div>`).join('')}
        </div>`).join('')||'<div class="muted">Спорных помещений на этаже нет.</div>'}
    </div>`;
  document.getElementById('modalScrim').classList.add('open');
}
function closeModal(){document.getElementById('modalScrim').classList.remove('open');}
function val(id){return document.getElementById(id).value;}
async function saveDeal(){
  const g=id=>document.getElementById(id).value;
  const tenant=g('f_tenant').trim();
  if(!tenant){document.getElementById('f_tenant').focus();return;}
  const temp=tempPick||document.querySelector('#f_temp button.on')?.dataset.t||'cold';
  const prio=g('f_priority')?+g('f_priority'):null;
  const sc=()=>{const o={};['fin','image','demand','longterm','classA'].forEach(k=>{const el=document.getElementById('f_sc_'+k);if(el&&el.value!=='')o[k]=+el.value;});return o;};
  if(editId){
    const d=DB.deals.find(x=>x.id===editId);
    const oldStage=d.stage;
    Object.assign(d,{tenant,industry:g('f_industry'),email:g('f_email'),phone:g('f_phone'),
      floor:+g('f_floor'),units:dealUnits.slice(),area:+g('f_area'),rate:+g('f_rate'),agreedRate:(g('f_agreed')===''?'':+g('f_agreed')),term:+g('f_term'),
      stage:g('f_stage'),temp,note:g('f_note'),basis:g('f_basis'),priority:prio,scores:sc(),updated:Date.now()});
    const nt=g('f_newtask').trim();              // если в поле новой задачи что-то набрано — не теряем
    if(nt){(d.tasks=d.tasks||[]).push({id:'t'+Date.now(),text:nt,date:g('f_newtaskdate'),done:false});}
    if(oldStage!==d.stage){
      d.acts.unshift({type:'stage',t:`Этап: ${STAGES.find(s=>s.id===oldStage).name} → ${STAGES.find(s=>s.id===d.stage).name}`,ts:Date.now()});
      if(d.stage==='won'&&oldStage!=='won'){d.signedAt=Date.now();d.acts.unshift({type:'won',t:'Договор подписан · '+money(d.area)+' м²',ts:Date.now()});}
    }
  }else{
    const nt=g('f_newtask').trim();
    const nd={id:'d'+Date.now(),tenant,industry:g('f_industry'),email:g('f_email'),phone:g('f_phone'),
      floor:+g('f_floor'),units:dealUnits.slice(),area:+g('f_area'),rate:+g('f_rate'),agreedRate:(g('f_agreed')===''?'':+g('f_agreed')),term:+g('f_term'),
      stage:g('f_stage'),temp,note:g('f_note'),basis:g('f_basis'),priority:prio,scores:sc(),created:Date.now(),updated:Date.now(),
      tasks:nt?[{id:'t'+Date.now(),text:nt,date:g('f_newtaskdate'),done:false}]:[],
      acts:[{type:'create',t:'Сделка создана',ts:Date.now()}]};
    if(nd.stage==='won'){nd.signedAt=Date.now();nd.acts.unshift({type:'won',t:'Договор подписан · '+money(nd.area)+' м²',ts:Date.now()});}
    DB.deals.push(nd);
  }
  await save();closeDrawer();
  const cur=document.querySelector('.nav button.active').dataset.v;render(cur);
}
async function delDeal(){
  if(!editId)return;
  const d=DB.deals.find(x=>x.id===editId);
  if(!confirm('Удалить сделку'+(d?' с «'+d.tenant+'»':'')+'? Действие нельзя отменить.'))return;
  DB.deals=DB.deals.filter(x=>x.id!==editId);
  await save();closeDrawer();
  const cur=document.querySelector('.nav button.active').dataset.v;render(cur);
}
function reRenderAfterDeal(did){const cur=document.querySelector('.nav button.active')?.dataset.v; if(cur)render(cur); /* перерисовка дашборда/таблиц */}
async function setTaskComment(did,tid,val){
  const d=DB.deals.find(x=>x.id===did); if(!d)return;
  const t=(d.tasks||[]).find(x=>x.id===tid); if(!t)return;
  val=(val||'').trim();
  if(val===(t.comment||''))return;
  t.comment=val;
  if(val)(d.acts=d.acts||[]).unshift({type:'note',t:'Комментарий к задаче: '+t.text,ts:Date.now(),note:val});
  d.updated=Date.now();
  await save(); openDeal(did); reRenderAfterDeal(did);
}
function tasksSorted(d){return (d.tasks||[]).slice().sort((a,b)=>{if(!!a.done!==!!b.done)return a.done?1:-1;return (a.date||'9999-99-99').localeCompare(b.date||'9999-99-99');});}
function taskRowHTML(did,t){
  const today=ymd();
  const done=!!t.done;
  const late=!done&&t.date&&t.date<today;
  const isToday=!done&&t.date===today;
  const cls=done?'done':(late?'late':'');
  let badge='';
  if(done) badge='<span class="te-badge ok">выполнено</span>';
  else if(t.date) badge=`<span class="te-badge ${late?'late':(isToday?'now':'soon')}">${late?'просрочено':(isToday?'сегодня':fmtDay(t.date))}</span>`;
  return `<div class="te ${cls}">
    <div class="te-top">
      <button class="te-check ${done?'on':''}" title="Отметить выполнено" onclick="toggleTask('${did}','${t.id}')"></button>
      <div class="te-main"><div class="te-text">${esc(t.text)}</div></div>
      ${badge}
      <button class="te-del" title="Удалить" onclick="delTask('${did}','${t.id}')">✕</button>
    </div>
    <input class="te-comment" value="${esc(t.comment||'')}" placeholder="комментарий / результат…" onchange="setTaskComment('${did}','${t.id}',this.value)">
  </div>`;
}
async function addTask(){
  if(!editId)return;
  const text=document.getElementById('f_newtask').value.trim();
  if(!text)return;
  const date=document.getElementById('f_newtaskdate').value;
  const d=DB.deals.find(x=>x.id===editId); if(!d)return;
  (d.tasks=d.tasks||[]).push({id:'t'+Date.now(),text,date,done:false,comment:''});
  (d.acts=d.acts||[]).unshift({type:'task',t:'Запланировано: '+text+(date?' ('+fmtDay(date)+')':''),ts:Date.now()});
  d.updated=Date.now();
  await save(); openDeal(editId); reRenderAfterDeal(editId);
}
async function toggleTask(did,tid){
  const d=DB.deals.find(x=>x.id===did); if(!d)return;
  const t=(d.tasks||[]).find(x=>x.id===tid); if(!t)return;
  t.done=!t.done;
  if(t.done){t.doneAt=Date.now();(d.acts=d.acts||[]).unshift({type:'done',t:'Выполнено: '+t.text,ts:Date.now(),note:t.comment||''});}
  d.updated=Date.now();
  await save(); openDeal(did); reRenderAfterDeal(did);
}
async function delTask(did,tid){
  const d=DB.deals.find(x=>x.id===did); if(!d)return;
  d.tasks=(d.tasks||[]).filter(x=>x.id!==tid); await save(); openDeal(did); reRenderAfterDeal(did);
}
/* ---------- файлы сделки (протоколы, договоры) ---------- */
function fileIcon(t,name){t=(t||'');name=(name||'').toLowerCase();
  if(t.includes('pdf')||name.endsWith('.pdf'))return '📄';
  if(t.includes('image')||/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(name))return '🖼';
  if(/\.(docx?|rtf|odt)$/.test(name))return '📝';
  if(/\.(xlsx?|csv|ods)$/.test(name))return '📊';
  if(/\.(zip|rar|7z)$/.test(name))return '🗜';
  return '📎';}
function fmtBytes(b){b=+b||0;if(b<1024)return b+' Б';if(b<1048576)return Math.round(b/1024)+' КБ';return (b/1048576).toFixed(1)+' МБ';}
function filesListHTML(d){
  const fs=d.files||[];
  if(!fs.length) return '<div class="muted">Файлов пока нет. Прикрепите протокол, договор, письмо и т.д.</div>';
  return fs.map(f=>`<div class="file-row">
      <span class="fic">${fileIcon(f.type,f.name)}</span>
      <span class="fnm" title="${esc(f.name)}" onclick="downloadFile('${d.id}','${f.id}')">${esc(f.name)}</span>
      <span class="fsz">${fmtBytes(f.size)}</span>
      ${f.ts?`<span class="fdate" title="Дата прикрепления">${ddmmyy(f.ts)}</span>`:''}
      <button class="fdl" title="Скачать" onclick="downloadFile('${d.id}','${f.id}')">⭳</button>
      <button class="fdel" title="Удалить" onclick="removeFile('${d.id}','${f.id}')">✕</button>
    </div>`).join('');
}
async function attachFiles(input){
  if(!editId){input.value='';return;}
  const d=DB.deals.find(x=>x.id===editId); if(!d){input.value='';return;}
  d.files=d.files||[];
  const files=[...input.files]; input.value=''; if(!files.length)return;
  let pending=files.length, added=0;
  const done=async()=>{ if(--pending>0)return;
    if(added){ d.updated=Date.now(); (d.acts=d.acts||[]).unshift({type:'note',t:'Прикреплены файлы: '+added,ts:Date.now()});
      try{ await save(); }catch(e){ alert('Не удалось сохранить: локальное хранилище переполнено. Удалите крупные файлы.'); }
    }
    openDeal(editId); reRenderAfterDeal(editId);
  };
  files.forEach(file=>{
    if(file.size>4*1024*1024){ alert('Файл «'+file.name+'» больше 4 МБ — слишком велик для локального хранилища браузера. Уменьшите файл или укажите ссылку в заметке.'); done(); return; }
    const r=new FileReader();
    r.onload=()=>{ d.files.push({id:'fl'+Date.now()+'_'+Math.round(Math.random()*1e5),name:file.name,type:file.type,size:file.size,data:r.result,ts:Date.now()}); added++; done(); };
    r.onerror=()=>{ done(); };
    r.readAsDataURL(file);
  });
}
function downloadFile(did,fid){
  const d=DB.deals.find(x=>x.id===did); if(!d)return;
  const f=(d.files||[]).find(x=>x.id===fid); if(!f)return;
  const a=document.createElement('a'); a.href=f.data; a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
}
async function removeFile(did,fid){
  const d=DB.deals.find(x=>x.id===did); if(!d)return;
  const f=(d.files||[]).find(x=>x.id===fid);
  if(f && !confirm('Удалить файл «'+f.name+'»?'))return;
  d.files=(d.files||[]).filter(x=>x.id!==fid); d.updated=Date.now();
  await save(); openDeal(did); reRenderAfterDeal(did);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();}});

/* ---------- backup / export ---------- */
function download(name,text,type){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportBackup(){download('summit-backup-'+ymd()+'.json',JSON.stringify(DB,null,2),'application/json');}
function exportCSV(){
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const head=['Этаж','Помещение','Арендатор','Отрасль','Площадь, кв.м','Базовая ставка $/кв.м','Согласованная ставка $/кв.м','Сумма $/мес','Этап','Статус','Приоритет','Следующая задача'];
  const rows=DB.deals.slice().sort((a,b)=>(a.floor||0)-(b.floor||0)).map(d=>{
    const nt=(d.tasks||[]).filter(t=>!t.done).sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];
    return [
    d.floor||'', (d.units||[]).join(' '), d.tenant, d.industry, d.area, d.rate, (d.agreedRate==null||d.agreedRate==='')?'':d.agreedRate, d.area*dealRate(d),
    (STAGES.find(s=>s.id===d.stage)||{}).name||d.stage, TEMPS[d.temp]||'', d.priority||'',
    nt?(nt.text+(nt.date?' ('+fmtDay(nt.date)+')':'')):''
  ].map(q).join(';');});
  const csv='﻿'+[head.map(q).join(';'),...rows].join('\r\n');
  download('summit-sdelki-'+ymd()+'.csv',csv,'text/csv;charset=utf-8');
}
async function importBackup(input){
  const file=input.files&&input.files[0]; if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!data||!Array.isArray(data.deals)) throw new Error('bad');
    if(!confirm('Загрузить данные из копии? Текущие данные будут заменены.')){input.value='';return;}
    DB=data;
    migrateDB(); // привести копию к текущей модели версии
    await save(); input.value=''; go('dash');
    alert('Данные восстановлены из копии. Записи перенесены в текущую версию.');
  }catch(e){ alert('Не удалось прочитать файл. Нужен JSON-файл резервной копии SUMMIT.'); input.value=''; }
}

/* ---------- boot ---------- */
(async()=>{
  document.querySelectorAll('[data-ic]').forEach(b=>{b.insertAdjacentHTML('afterbegin',ic(b.dataset.ic));});
  await load();go('dash');
})();
